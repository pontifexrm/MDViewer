<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The app icon for Linux: MDViewer/Resources/AppIcon/appiconfg.svg over the
     appicon.svg plate, composited here because nothing does it for us the way
     MAUI does on Windows. Rounded, as Linux desktop icons usually are. Keep the
     artwork in step with those two files. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="456" height="456" rx="80" fill="#2B579A" />

    <!-- page -->
    <rect x="108" y="78" width="240" height="300" rx="14" fill="#FFFFFF" />

    <!-- title block -->
    <rect x="136" y="114" width="150" height="30" rx="6" fill="#2B579A" />
    <!-- title rule -->
    <rect x="136" y="158" width="184" height="3" rx="1.5" fill="#E4E9F0" />

    <!-- body lines -->
    <g fill="#C3CEDB">
        <rect x="136" y="186" width="184" height="12" rx="6" />
        <rect x="136" y="214" width="184" height="12" rx="6" />
        <rect x="136" y="242" width="152" height="12" rx="6" />
        <rect x="136" y="270" width="184" height="12" rx="6" />
        <rect x="136" y="298" width="184" height="12" rx="6" />
        <rect x="136" y="326" width="120" height="12" rx="6" />
    </g>
</svg>
